[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "Broker-agnostic quantitative research platform: leak-free event-driven backtesting engine, cost/risk models, and walk-forward validation infrastructure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Quant Platform Engineering" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.1",
    "pydantic>=2.6,<3.0",
    "pyarrow>=15.0",
    # Milestone 4C baseline predictive model framework: each of these is
    # imported directly by quant_platform.ml (metrics.py, comparison.py)
    # and quant_platform.ml.model_zoo (linear.py, lightgbm_model.py,
    # xgboost_model.py, catboost_model.py) -- never merely a transitive
    # dependency of another declared package. Floors are the major/minor
    # line this milestone was actually tested against (see the delivery
    # report for exact patch versions); ceilings exclude the next major
    # version, which for every one of these libraries has historically
    # meant breaking API/behavior changes this platform has not verified
    # against.
    "lightgbm>=4.0,<5.0",
    "xgboost>=3.0,<4.0",
    "catboost>=1.2,<2.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.11,<2.0",
    # Milestone 4D leakage-safe optimization engine: imported directly by
    # quant_platform.optimization.study (sampler construction, ask()/tell()
    # resume replay). The declared range is WIDER than what has actually
    # been empirically verified (only 4.9.0, the installed patch at
    # delivery time) -- deterministic TPE/Random sampler resume depends on
    # Optuna's internal RNG-consumption order, which is not part of its
    # public API contract and could change across any release in this
    # range. `OptimizationRunner` binds the ACTUAL installed Optuna version
    # into the persisted `ENVIRONMENT_SNAPSHOT` artifact at optimization
    # creation time and fails closed (`OptimizationResumeError`) on
    # `.resume()` if the currently installed version differs -- see
    # optimization/runner.py's `_require_compatible_optuna_version`.
    "optuna>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "mypy>=1.9",
    "ruff>=0.4",
    "pandas-stubs>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, isolated unit tests",
    "integration: multi-component integration tests",
    "performance: throughput/latency benchmarks, may be slow",
]

[tool.coverage.run]
source = ["src/quant_platform"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# NOTE: python_version below targets the environment mypy actually runs
# under (3.12), not the package's minimum supported version (3.10, see
# requires-python above). Every construct in our own source is written to
# also work on 3.10 (postponed evaluation via `from __future__ import
# annotations` throughout, no 3.11+/3.12+-only syntax); pinning 3.10 here
# instead fails purely because numpy's bundled stubs use a 3.12-only `type`
# statement internally, unrelated to our own code's actual compatibility.
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ARG",              # unused arguments
    "PTH",              # prefer pathlib
]
ignore = [
    "E501",  # line length handled by formatter/line-length setting
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["quant_platform"]
